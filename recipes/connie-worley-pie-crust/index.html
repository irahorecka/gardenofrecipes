    <div id="root"><div hidden><h1>Connie Worley Pie Crust Recipe</h1>
<h2>Ingredients</h2>
<ul>
<li>3 cups flour</li>
<li>1 tsp salt</li>
<li>1 cup lard</li>
<li>1 beaten egg</li>
<li>1 tsp vinegar</li>
<li>5 tbsp cold water</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix the flour, salt, and lard with a fork</li>
<li>Add the beaten egg, vinegar, and cold water</li>
</ol><p><a href="/">Back to Garden of Recipes</a></p></div></div>
