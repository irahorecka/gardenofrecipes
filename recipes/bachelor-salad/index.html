    <div id="root"><div hidden><h1>Bachelor Salad</h1>
<h2>Ingredients</h2>
<ul>
<li>1/4 head shredded cabbage</li>
<li>1 large chopped apple</li>
<li>1 small chopped onion</li>
<li>2 tbsp mayonnaise</li>
<li>2 tbsp milk</li>
<li>1 tsp prepared mustard</li>
<li>salt, pepper, and sugar, to taste</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix together all ingredients</li>
<li>Eat</li>
