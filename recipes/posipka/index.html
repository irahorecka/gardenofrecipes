    <div id="root"><div hidden><h1>Posipka</h1>
<p>From Weimer Cookbook</p>
<h2>Ingredients</h2>
<ul>
<li>1 cup flour</li>
<li>3/4 cup sugar</li>
<li>1/2 stick oleo</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix together flour, sugar, and oleo</li>
<li>Mix again to form crumb texture</li>
<li>Sprinkle on filled kolaches before baking</li>
</ol><p><a href="/">Back to Garden of Recipes</a></p></div></div>
