  <body>
    <div id="root"><div hidden><h1>Pie Crust</h1>
<p>Very good</p>
<h2>Ingredients</h2>
<ul>
<li>1 1/2 cups flour</li>
<li>1 tsp salt</li>
<li>1/2 cup Crisco</li>
<li>6 tbsp ice water</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Sift the flour with the salt</li>
<li>Cut in the Crisco</li>
<li>Add the ice water, 2 tbsp at a time</li>
<li>Mix with a fork</li>
<li>Use</li>
</ol><p><a href="/">Back to Garden of Recipes</a></p></div></div>
